<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">STEAM Achievement and Rewards</title>
  <desc id="desc">A green achievement star at the centre of two blue and green STEAM orbits.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="50" x2="450" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b5874"/><stop offset="1" stop-color="#0c2f43"/>
    </linearGradient>
    <linearGradient id="star" x1="190" y1="150" x2="330" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#35b98d"/><stop offset="1" stop-color="#12815f"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g fill="none" stroke-width="16" opacity=".92">
    <ellipse cx="256" cy="256" rx="174" ry="96" stroke="#75d2b4" transform="rotate(28 256 256)"/>
    <ellipse cx="256" cy="256" rx="174" ry="96" stroke="#4da9c9" transform="rotate(-28 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="96" fill="#f8fbfa"/>
  <path d="m256 187 20 41 45 7-33 32 8 45-40-21-40 21 8-45-33-32 45-7z" fill="url(#star)"/>
  <g fill="#efb44c"><circle cx="123" cy="168" r="21"/><circle cx="389" cy="344" r="21"/></g>
</svg>
